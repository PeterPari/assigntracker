<title>Assignment Tracker</title>
<style>
/* Layout: one full-width column. Progress bar and toggles on top, compact 32px rows, a slim add bar under the list, save and trash pinned bottom-right. Dark only. */
:root {
  color-scheme: dark;
  --bg: #13151a;
  --row-hover: #1a1d24;
  --raised: #232731;
  --line: #22262e;
  --line-2: #323844;
  --text: #e7e9ee;
  --muted: #98a0ad;
  --ph: #7b8392;
  --st-none: #8a92a0;
  --st-prog: #f2c94c;
  --st-done: #4cc38a;
  --done-bg: rgba(76, 195, 138, .075);
  --done-text: #8ea599;
  --accent: #8ab4ff;
  --accent-bg: rgba(138, 180, 255, .14);
  --danger: #f0716a;
  --danger-bg: #c93c35;
  --bar-track: #22262e;
  --bar-fill: #26774a;
  --subj-none: #4a5160;
  --subj-math: #91c1f3;
  --subj-history: #fbde71;
  --subj-english: #ee899c;
  --subj-physics: #6bf6af;
  --subj-french: #f9a95c;
  --subj-aics: #65f2ee;
  --subj-philosophy: #e6b31c;
  --subj-research: #c4a484;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font: 13.5px/1.25 var(--font);
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; cursor: pointer; }
input { font: inherit; color: inherit; background: none; border: 0; padding: 0; margin: 0; min-width: 0; }
input::placeholder { color: var(--ph); opacity: 1; }
input:focus-visible { outline: none; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg { display: block; flex: none; }
[hidden] { display: none !important; }

#app { padding: 12px 14px 72px; }
@media (min-width: 720px) { #app { padding-left: 100px; padding-right: 100px; } }

/* header: progress + toggles */
.hd { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 6px; padding-bottom: 10px; background: var(--bg); }
.bar { position: relative; flex: 1; height: 22px; border-radius: 6px; background: var(--bar-track); overflow: hidden; }
.fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--bar-fill); transition: width .3s ease; }
.pct { position: absolute; inset: 0; display: grid; place-items: center; font-size: 12px; font-weight: 600; letter-spacing: .2px; color: #fff; font-variant-numeric: tabular-nums; }
.ib { width: 26px; height: 26px; flex: none; display: grid; place-items: center; border-radius: 6px; color: var(--muted); }
.ib:hover { background: var(--raised); color: var(--text); }
.ib.on { color: var(--accent); background: var(--accent-bg); }
.ib.warn { color: var(--st-prog); cursor: default; }

/* hamburger menu: a small column of toggles under the hamburger */
.mp { position: absolute; top: 30px; right: 32px; z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 3px; border-radius: 8px; background: var(--raised); border: 1px solid var(--line-2); box-shadow: 0 6px 18px rgba(0, 0, 0, .5); }
.mp .ib:hover { background: rgba(255, 255, 255, .08); }
.mp .ib.on:hover { background: var(--accent-bg); }
.msep { width: 18px; height: 1px; margin: 2px 0; background: var(--line-2); }

/* rows */
#list { display: flex; flex-direction: column; gap: 2px; }
.row {
  position: relative; display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 4px 0 11px;
  border-radius: 6px; box-shadow: inset 0 -1px 0 var(--line);
  transition: transform .16s ease, background-color .12s ease;
  user-select: none; -webkit-user-select: none;
}
/* subject banner: a solid strip on the left edge, colored by class (data-subj); grey when the subject matches none */
.row::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; border-radius: 6px 0 0 6px; background: var(--subj, var(--subj-none)); pointer-events: none; }
.row[data-subj="math"] { --subj: var(--subj-math); }
.row[data-subj="history"] { --subj: var(--subj-history); }
.row[data-subj="english"] { --subj: var(--subj-english); }
.row[data-subj="physics"] { --subj: var(--subj-physics); }
.row[data-subj="french"] { --subj: var(--subj-french); }
.row[data-subj="aics"] { --subj: var(--subj-aics); }
.row[data-subj="philosophy"] { --subj: var(--subj-philosophy); }
.row[data-subj="research"] { --subj: var(--subj-research); }
.row:hover { background: var(--row-hover); }
.row.done { background: var(--done-bg); }
.row.done:hover { background: rgba(76, 195, 138, .11); }
.row.drag { transition: none; z-index: 4; background: var(--raised); box-shadow: 0 6px 18px rgba(0, 0, 0, .5); }
body.dragging, body.dragging * { cursor: grabbing !important; user-select: none; -webkit-user-select: none; }

.st { width: 24px; height: 24px; flex: none; display: grid; place-items: center; border-radius: 50%; }
.st:hover { background: rgba(255, 255, 255, .06); }
.s0 .st { color: var(--st-none); }
.s1 .st { color: var(--st-prog); }
.s2 .st { color: var(--st-done); }

.nm, .tf { min-width: 0; height: 24px; align-items: center; padding: 0 6px; border-radius: 5px; cursor: text; }
.nm { flex: 1; min-width: 88px; display: flex; }
.nm:focus-within, .tf:focus-within { background: var(--raised); box-shadow: inset 0 0 0 1px var(--accent); }
.nmi, .tfi { width: 100%; text-overflow: ellipsis; pointer-events: none; user-select: text; -webkit-user-select: text; }
.nm:focus-within .nmi, .tf:focus-within .tfi { pointer-events: auto; }
.row.done .nmi, .row.done .tfi, .row.done .ddi, .row.done .dv, .row.done .sv, .row.done .ec { color: var(--done-text); }

/* optional columns: subject, due date, assignment type (shown from the menu) */
.cs, .cd, .ct { display: none; }
.cs, .ct { flex: 0 1 110px; min-width: 56px; } /* narrow windows squeeze these before the name */
.ct { flex-basis: 124px; } /* room for the "Assignment type" placeholder */
.cd { flex: none; width: 128px; }
#list.c-subject .cs, #list.c-type .ct { display: flex; }
#list.c-due .cd { display: block; }
.ddi { width: 100%; height: 24px; padding: 0 4px 0 6px; border-radius: 5px; color-scheme: dark; font-variant-numeric: tabular-nums; }
.ddi:hover { background: var(--raised); }
.ddi:focus { background: var(--raised); box-shadow: inset 0 0 0 1px var(--accent); }
.ddi.empty { color: var(--muted); }
.ddi::-webkit-calendar-picker-indicator { opacity: .55; cursor: pointer; }

.du { flex: none; display: flex; justify-content: flex-end; min-width: 108px; }
.dv { display: none; height: 24px; padding: 0 6px; border-radius: 5px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.dv:hover, .sv:hover { background: var(--raised); }
.row.has-dur:not(.ed-dur) .dv { display: block; }
.de { display: none; align-items: center; gap: 3px; height: 24px; padding: 0 6px; border-radius: 5px; background: var(--raised); }
.row.ed-dur .de, .row:not(.has-dur) .de { display: flex; }
.de:focus-within, .se:focus-within, .ee:focus-within { box-shadow: inset 0 0 0 1px var(--accent); }
.de input { width: 30px; text-align: right; font-variant-numeric: tabular-nums; }
.u { color: var(--muted); }
.u:nth-of-type(1) { margin-right: 5px; }

.tm { display: none; flex: none; align-items: center; gap: 4px; }
#list.times .tm { display: flex; }
.sc { position: relative; display: flex; justify-content: flex-end; min-width: 80px; height: 24px; cursor: text; }
.sg, .sv { display: none; height: 24px; padding: 0 6px; border-radius: 5px; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
.sg { width: 72px; pointer-events: none; }
.row:not(.has-start):not(.ed-start) .sg { display: block; }
.row.has-start:not(.ed-start) .sv { display: block; }
.row.derived .sv { color: var(--muted); }
.row.pend .sv { color: var(--text); box-shadow: inset 0 0 0 1px var(--st-prog); }
.se, .ee { display: none; align-items: center; height: 24px; padding: 0 4px 0 6px; border-radius: 5px; background: var(--raised); color: var(--text); font-variant-numeric: tabular-nums; }
.row.ed-start .se, .row.ed-end .ee { display: flex; }
.se input, .ee input { width: 20px; text-align: center; }
.co { color: var(--muted); }
.sa, .ea { height: 18px; margin-left: 4px; padding: 0 5px; border-radius: 4px; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-bg); }
.ec { display: flex; align-items: center; justify-content: flex-end; gap: 2px; min-width: 100px; padding-left: 6px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.ec.blank svg { visibility: hidden; }
.ev { height: 24px; padding: 0 6px; border-radius: 5px; cursor: default; }
.ev:not(:disabled) { cursor: text; }
.ev:not(:disabled):hover { background: var(--raised); }
.row.ed-end .ev { display: none; }

.rm { width: 24px; height: 24px; flex: none; display: grid; place-items: center; border-radius: 5px; color: var(--muted); opacity: 0; }
.row:hover .rm, .rm:focus-visible { opacity: 1; }
.rm:hover { color: var(--danger); background: rgba(240, 113, 106, .12); }

/* chaining warning popup, beside the start field */
.pop { display: none; position: absolute; right: calc(100% + 10px); top: 50%; transform: translateY(-50%); z-index: 6; align-items: center; gap: 2px; padding: 3px; border-radius: 8px; background: var(--raised); border: 1px solid var(--line-2); box-shadow: 0 6px 18px rgba(0, 0, 0, .5); }
.pop::after { content: ""; position: absolute; left: 100%; top: 50%; width: 8px; height: 8px; margin-left: -5px; transform: translateY(-50%) rotate(45deg); background: var(--raised); border-top: 1px solid var(--line-2); border-right: 1px solid var(--line-2); }
.row.pend .pop { display: flex; }
.pop > * { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; }
.pc { color: var(--accent); }
.pd { color: var(--st-prog); }
.px { color: var(--muted); }
.pc:hover, .pd:hover, .px:hover { background: rgba(255, 255, 255, .08); }
.pop button:disabled { opacity: .35; cursor: default; background: none; }

/* add, save, clear */
.add { display: flex; align-items: center; justify-content: center; width: 100%; height: 30px; margin-top: 6px; border: 1px dashed var(--line-2); border-radius: 6px; color: var(--muted); }
.add:hover { color: var(--text); background: var(--row-hover); }
.clr, .sav { position: fixed; bottom: 12px; z-index: 5; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; color: var(--muted); background: var(--raised); box-shadow: 0 0 0 1px var(--line-2); }
.clr { right: 12px; }
.sav { right: 54px; }
.clr:hover, .sav:hover { color: var(--text); }
.clr.armed { color: #fff; background: var(--danger-bg); box-shadow: none; }
.sav.ok { color: var(--st-done); }
.sav.bad { color: var(--st-prog); }
.clr:disabled, .sav.off:not(.dl) { opacity: .35; cursor: default; } /* .dl: Shift is held, the button downloads and is never greyed */
.sav.off:not(.dl):hover { color: var(--muted); }

/* "save these again?" popup, just above the save button; the rows it asks about are highlighted */
.ag { position: fixed; right: 12px; bottom: 54px; z-index: 6; display: flex; align-items: center; gap: 2px; padding: 3px 3px 3px 10px; border-radius: 8px; background: var(--raised); border: 1px solid var(--line-2); box-shadow: 0 6px 18px rgba(0, 0, 0, .5); white-space: nowrap; }
.ag::after { content: ""; position: absolute; top: 100%; right: 54px; width: 8px; height: 8px; margin-top: -5px; transform: rotate(45deg); background: var(--raised); border-right: 1px solid var(--line-2); border-bottom: 1px solid var(--line-2); }
.agq { margin-right: 6px; }
.ag button { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 5px; }
.agy { color: var(--st-done); }
.agn { color: var(--muted); }
.ag button:hover { background: rgba(255, 255, 255, .08); }
.row.again, .row.again:hover { background: rgba(242, 201, 76, .09); box-shadow: inset 0 0 0 1px rgba(242, 201, 76, .6); }

/* all-done popup */
.ov { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(8, 9, 12, .62); animation: ovin .16s ease; }
.dlg { position: relative; width: min(380px, 100%); padding: 30px 28px 26px; border-radius: 12px; background: var(--raised); border: 1px solid var(--line-2); box-shadow: 0 14px 40px rgba(0, 0, 0, .6); text-align: center; animation: dlgin .18s ease; }
.dk { width: 44px; height: 44px; margin: 0 auto 14px; display: grid; place-items: center; border-radius: 50%; color: var(--st-done); background: var(--done-bg); }
.dm { margin: 0; font-size: 16px; line-height: 1.45; }
.dm b { display: block; margin-top: 2px; font-size: 20px; font-weight: 650; color: var(--st-done); font-variant-numeric: tabular-nums; }
.dx { position: absolute; top: 8px; right: 8px; }
.dxs { right: 38px; }
.ib.ok { color: var(--st-done); }
.ib.bad { color: var(--st-prog); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@keyframes ovin { from { opacity: 0; } }
@keyframes dlgin { from { opacity: 0; transform: translateY(6px) scale(.97); } }

/* tooltip */
#tip { position: fixed; z-index: 50; left: 0; top: 0; padding: 4px 8px; border-radius: 5px; background: #0b0c0f; color: var(--text); border: 1px solid var(--line-2); font-size: 12px; white-space: nowrap; pointer-events: none; opacity: 0; transition: opacity .12s ease; }
#tip.show { opacity: 1; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<div id="app">
  <div class="hd">
    <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i class="fill" id="fill"></i><b class="pct" id="pct">0%</b></div>
    <span class="ib warn" id="warn" hidden data-tip="Not saved" role="img" aria-label="Not saved"></span>
    <button class="ib" id="menu" type="button" data-tip="Menu" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menuPop"></button>
    <div class="mp" id="menuPop" role="group" aria-label="Menu" hidden>
      <button class="ib" id="colSubject" type="button" aria-pressed="false"></button>
      <button class="ib" id="colDue" type="button" aria-pressed="false"></button>
      <button class="ib" id="colType" type="button" aria-pressed="false"></button>
      <span class="msep" aria-hidden="true"></span>
      <button class="ib" id="times" type="button"></button>
      <button class="ib" id="chain" type="button" hidden></button>
    </div>
    <button class="ib" id="reload" type="button" data-tip="Reload" aria-label="Reload"></button>
  </div>
  <div id="list"></div>
  <button class="add" id="add" type="button" data-tip="Add" aria-label="Add"></button>
</div>
<button class="sav" id="save" type="button" aria-label="Save"></button>
<span class="sr" id="saveStatus" role="status" aria-live="polite"></span>
<div class="ag" id="again" role="dialog" aria-labelledby="againQ" hidden>
  <span class="agq" id="againQ">Would you like to save these again?</span>
  <button class="agy" id="againYes" type="button" data-tip="Save them again" aria-label="Save them again"></button>
  <button class="agn" id="againNo" type="button" data-tip="Skip them" aria-label="Skip them"></button>
</div>
<button class="clr" id="clear" type="button" aria-label="Clear"></button>
<div class="ov" id="done" role="dialog" aria-modal="true" aria-labelledby="doneMsg" hidden>
  <div class="dlg">
    <span class="dk" id="doneIcon"></span>
    <p class="dm" id="doneMsg">Peter finished all of his assignments in <b id="doneTime"></b></p>
    <button class="ib dx dxs" id="doneShare" type="button" data-tip="Share" aria-label="Share"></button>
    <button class="ib dx" id="doneClose" type="button" data-tip="Close" aria-label="Close"></button>
    <span class="sr" id="shareStatus" role="status" aria-live="polite"></span>
  </div>
</div>
<div id="tip" role="tooltip"></div>

<script>
/* <logic> */
const DAY = 1440;
const pad2 = (n) => String(n).padStart(2, '0');
const mod = (t) => ((Math.round(t) % DAY) + DAY) % DAY;

/** 150 -> "2 hrs 30 min"; empty units are dropped, "hr" is singular only for 1. */
function fmtDur(total) {
  const h = Math.floor(total / 60), m = total % 60, out = [];
  if (h) out.push(h + (h === 1 ? ' hr' : ' hrs'));
  if (m) out.push(m + ' min');
  return out.join(' ');
}

/** 150 -> "2 hours and 30 minutes", 45 -> "45 minutes", 120 -> "2 hours". Whole words, for the all-done message. */
function fmtDurLong(total) {
  const h = Math.floor(total / 60), m = total % 60, out = [];
  if (h) out.push(h + (h === 1 ? ' hour' : ' hours'));
  if (m || !h) out.push(m + (m === 1 ? ' minute' : ' minutes'));
  return out.join(' and ');
}

/** Minutes since midnight (any integer, wraps past 24h) -> "3:30 PM". */
function fmtClock(total) {
  const t = mod(total), h24 = Math.floor(t / 60);
  return (h24 % 12 || 12) + ':' + pad2(t % 60) + ' ' + (h24 < 12 ? 'AM' : 'PM');
}

/** Editor fields -> minutes since midnight, null when both are empty, undefined when invalid. 13-23 read as 24-hour. */
function startFromParts(hStr, mStr, ap) {
  hStr = String(hStr).trim(); mStr = String(mStr).trim();
  if (hStr === '' && mStr === '') return null;
  if (hStr === '') return undefined;
  let h = Number(hStr); const m = mStr === '' ? 0 : Number(mStr);
  if (!Number.isInteger(h) || !Number.isInteger(m) || h < 0 || h > 23 || m < 0 || m > 59) return undefined;
  let pm = ap === 'PM';
  if (h > 12) { h -= 12; pm = true; } else if (h === 0) { h = 12; pm = false; }
  return ((h % 12) + (pm ? 12 : 0)) * 60 + m;
}

/** A row exists only with both a name and a duration. */
const isComplete = (r) => r.name.trim() !== '' && r.mins > 0;

/** Start and end per row. Chained: a row follows the previous end unless it has a start of its own, which cuts the chain
 *  there; the rows after it continue from its end. Unchained: each row uses only its own start. */
function schedule(rows, chain) {
  let cursor = null;
  return rows.map((r, i) => {
    const derived = chain && i > 0 && r.start == null;
    const start = derived ? cursor : r.start;
    const dur = r.mins > 0 ? r.mins : 0;
    cursor = start == null ? null : start + dur;
    return {
      start: start == null ? null : mod(start),
      end: start == null || !dur ? null : mod(start + dur),
      derived,
    };
  });
}

/** Average of done-rows share and done-minutes share, in whole percent. In-progress counts as 0. */
function progress(rows) {
  const all = rows.filter(isComplete);
  const n = all.length, m = all.reduce((a, r) => a + r.mins, 0);
  if (!n || !m) return 0;
  const done = all.filter((r) => r.status === 2);
  const nd = done.length, md = done.reduce((a, r) => a + r.mins, 0);
  if (nd === n) return 100;
  return Math.min(99, Math.round(((nd / n + md / m) / 2) * 100));
}

/** Everything is checked off: at least one finished row, and every finished row is done. Unfinished rows are not assignments yet. */
function allDone(rows) {
  const all = rows.filter(isComplete);
  return all.length > 0 && all.every((r) => r.status === 2);
}

/** Total minutes across the finished rows: the time reported when everything is done. */
const totalMins = (rows) => rows.filter(isComplete).reduce((a, r) => a + r.mins, 0);

/** 1 -> "1 assignment", 3 -> "3 assignments": the count line on the shared picture. */
const countLabel = (n) => n + (n === 1 ? ' assignment' : ' assignments');

/** Setting a row's end to a clock time sets its duration: minutes forward from its start (1-1439, wraps past midnight). */
function durationFromEnd(start, end) {
  if (start == null || end == null) return null;
  const d = mod(end - start);
  return d === 0 ? null : d;
}

/** Marking a row done records when it finished: the duration becomes start-to-now. A start more than 12 hours ahead of now
 *  means the row was finished early, so the planned duration is kept (null). */
function durationOnDone(start, now) {
  const d = durationFromEnd(start, now);
  return d != null && d <= 720 ? d : null;
}

/** Turning chaining on: every lower row's own start is discarded and the list follows the first row. */
const chainOn = (rows) => rows.map((r, i) => (i === 0 || r.start == null ? r : { ...r, start: null }));

/** Chained: while the first row is not started, its start is the plan for the whole list and stays in the first slot when
 *  another row takes that place. A started row keeps its own start wherever it goes. */
function keepPlan(next, old) {
  if (!old || old.status !== 0 || old.start == null || !next.length || next[0].id === old.id) return next;
  return next.map((r, i) => (r.id === old.id ? { ...r, start: null } : i === 0 && r.start == null ? { ...r, start: old.start } : r));
}

function moveRow(rows, from, to, chain) {
  if (from === to || from < 0 || to < 0 || from >= rows.length || to >= rows.length) return rows;
  const next = rows.slice(), [r] = next.splice(from, 1);
  next.splice(to, 0, r);
  return chain ? keepPlan(next, rows[0]) : next;
}

function removeRow(rows, id, chain) {
  const next = rows.filter((r) => r.id !== id);
  return chain ? keepPlan(next, rows[0]) : next;
}

/** The optional columns, in the order they appear in a row and in the menu. */
const COLS = ['subject', 'due', 'type'];
const colsOf = (c) => ({ subject: !!c && c.subject === true, due: !!c && c.due === true, type: !!c && c.type === true });

/**
 * Which class a free-text subject belongs to, for the colored banner on a row; '' when it matches none.
 * Aliases and course names count ("Pre-Calculus" is math, "Adv. AI & Comp Sci" is aics). The first rule that
 * matches wins, so the more specific words come first.
 */
const SUBJECT_RULES = [
  ['philosophy', /\bphil(osophy)?\b/],
  ['history', /\bhist(ory)?\b/],
  ['research', /\b(research|practicum)/],
  ['aics', /\b(aics|ai|cs)\b|\bcomp(uter)?\.?\s*sci/],
  ['physics', /\bphysics/],
  ['french', /\bfrench/],

  /* ---------- share the result as a picture ---------- */

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);

    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);

      ctx.font = weight + ' ' + px + 'px ' + FONT;

    ctx.fillStyle = tok('--bg', '#13151a');

    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    ctx.fillStyle = tok('--text', '#e7e9ee'); fitText(ctx, LEAD, cx, 298, 1040, 46, 500, 30);
    ctx.fillStyle = green; fitText(ctx, d.time, cx, 400, 1040, 100, 700, 36);
    ctx.fillStyle = tok('--muted', '#98a0ad'); fitText(ctx, d.count + ' \u00b7 ' + d.date, cx, 470, 1040, 30, 500, 20);

   *  Resolves to what happened: shared | copied | saved | limited | fail, or null when the person backed out. */

  /* ---------- list events ---------- */
  list.addEventListener('click', (e) => {

    else if (t.closest('.pd')) resolvePending(true);
    else if (t.closest('.px')) cancelPending();

  /* ---------- save ---------- */
  // Save adds the finished rows to the save history in the shared database: one document per save, under saves/.
  // Shift-click downloads every save as one CSV file instead. While Shift is held the button shows a download arrow to say so.
  const SAVES = 'saves', PAGE = 500;

  const useDb = async () => { try { return window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (_) { return null; } };
  /** A database call, tried once more after a short pause when the database is briefly unavailable. */
  async function retry(fn) {
    try { return await fn(); } catch (err) { if (!err || err.code !== 'unavailable') throw err; await sleep(600); return fn(); }
  }
  /** Every save in the database, a page at a time (a query returns at most 1000 documents). Throws when they cannot be read. */
  async function readSaves(db) {
    const out = [];
    for (let last = null; ;) {
      let q = db.collection(SAVES).orderBy('k').limit(PAGE);
      if (last != null) q = q.where('k', '>', last);

      if (typeof k !== 'string' || k === last) return out;
      last = k;
    }

    try { await retry(() => db.doc(SAVES + '/' + rec.k).set(rec)); return 'saved'; } catch (_) { return 'fail'; } // same id on a retry: never saved twice
  }

  /** Adds the list to the saves. Assignments saved before are highlighted and the popup asks whether to save them again.
   *  Resolves to saved | fail, or null when there is nothing to save or the popup is asking. */
  async function saveList() {
    const at = new Date();
    const all = saveRecord(state, stamp(at), saveKey(at.getTime(), Math.random().toString(36).slice(2, 8))); // the list as it is now
    if (!all) return null;
    const db = await useDb();
    if (!db) return 'fail';
    let seen;
    try { seen = savedIds(await readSaves(db)); } catch (_) { return 'fail'; } // without the history, repeats cannot be told apart
    const repeats = all.rows.filter((r) => seen.has(r.id)).map((r) => r.id);
    if (!repeats.length) return writeSave(db, all);
    const rows = all.rows.filter((r) => !seen.has(r.id));
    openAgain({ db, all, fresh: rows.length ? { ...all, rows } : null }, repeats);
    return null;
  }

  /** Every save as one CSV file. Resolves to downloaded | empty | dlfail, or null when the viewer declined the download. */
  async function downloadSaves() {
    const db = await useDb();
    if (!db) return 'dlfail';
    let csv;
    try { csv = savesCsv(await readSaves(db)); } catch (_) { return 'dlfail'; }
    if (!csv) return 'empty';
    try {
      const dl = window.claude && window.claude.use ? await window.claude.use('downloads') : null;
      if (!dl) return 'dlfail';
      const name = 'assignment-saves-' + stamp(new Date()).slice(0, 10) + '.csv';

      return 'downloaded';
    } catch (err) {
      return err && err.code === 'declined' ? null : 'dlfail';
    }
  }

  function openAgain(a, ids) {

  async function answerAgain(yes) {
    const a = again;
    if (!a || saveBusy) return;
    closeAgain(true);
    const rec = yes ? a.all : a.fresh;
    saveBusy = true;
    try { flashSave(rec ? await writeSave(a.db, rec) : 'none'); } finally { saveBusy = false; }
  }
  againYes.addEventListener('click', () => answerAgain(true));
  againNo.addEventListener('click', () => answerAgain(false));
  againPop.addEventListener('keydown', (e) => { // Tab cycles between the two buttons
    if (e.key !== 'Tab') return;
    e.preventDefault();
    (document.activeElement === againYes ? againNo : againYes).focus();
  });

  sav.addEventListener('mousedown', (e) => { if (e.shiftKey) e.preventDefault(); }); // a Shift-click must not select text
  sav.addEventListener('click', async (e) => {
    if (closeAgain()) return;
    if (saveBusy || (!e.shiftKey && sav.classList.contains('off'))) return;
    saveBusy = true;
    try { flashSave(await (e.shiftKey ? downloadSaves() : saveList())); } finally { saveBusy = false; }
  });

  const watchShift = (e) => { shiftHeld = e.shiftKey; syncSave(); };
  document.addEventListener('keydown', watchShift, true);
  document.addEventListener('keyup', watchShift, true);
  window.addEventListener('blur', () => { shiftHeld = false; syncSave(); }); // Shift let go while another window had the keyboard: no keyup comes
  document.addEventListener('focusin', syncSave);
  document.addEventListener('focusout', () => setTimeout(syncSave, 0)); // once the focus has settled on its new element
  sav.addEventListener('pointerenter', () => { overSave = true; syncSave(); });
  sav.addEventListener('pointerleave', () => { overSave = false; syncSave(); });

  document.addEventListener('pointerdown', (e) => {
    if (pending && !e.target.closest('.pop')) cancelPending();
    if (armed && !e.target.closest('#clear')) disarm();
    if (!menuPop.hidden && !e.target.closest('#menuPop, #menu')) setMenu(false);
    if (again && !e.target.closest('#again, #save')) closeAgain();
  }, true);
  document.addEventListener('keydown', (e) => {
    if (e.key !== 'Escape') return;
    closeDone();
    if (!menuPop.hidden) setMenu(false, true);
    if (pending) cancelPending();
    if (armed) disarm();
    closeAgain(true);
  });

  /* ---------- drag to reorder ---------- */
  let track = null, drag = null, lastY = 0, raf = 0, suppressClick = false;

  list.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    const el = e.target.closest('.row');
    if (!el || e.target.closest('input, .pop, .sa, .ea')) return;
    track = { el, id: el.dataset.id, x: e.clientX, y: e.clientY, pid: e.pointerId };
  });

  window.addEventListener('pointermove', (e) => {
    if (!track || e.pointerId !== track.pid) return;
    if (!drag) {
      if (Math.hypot(e.clientX - track.x, e.clientY - track.y) < 5) return;
      startDrag(e);
    }
    lastY = e.clientY;
    moveDrag();
  });
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  window.addEventListener('click', (e) => { if (suppressClick) { e.stopPropagation(); e.preventDefault(); suppressClick = false; } }, true);

  function startDrag(e) {
    hideTip();
    const a = document.activeElement;
    if (a && a !== document.body && a.blur) a.blur(); // commit any open inline edit first
    if (pending) cancelPending();
    const from = indexOf(track.id);
    if (from < 0) { track = null; return; }
    const rows = state.rows.map((r) => els.get(r.id));
    const item = rows[from];
    const gap = parseFloat(getComputedStyle(list).rowGap) || 0;
    drag = { rows, from, to: from, item, pitch: item.offsetHeight + gap, tops: rows.map((r) => r.offsetTop), startY: e.clientY + window.scrollY };
    lastY = e.clientY;
    item.classList.add('drag');
    document.body.classList.add('dragging');
    try { item.setPointerCapture(e.pointerId); } catch (_) { /* optional */ }
    if (window.getSelection) window.getSelection().removeAllRanges();
    raf = requestAnimationFrame(autoScroll);
  }

  function moveDrag() {
    const d = drag, n = d.rows.length;
    const y = lastY + window.scrollY - d.startY;
    const dy = Math.max(d.tops[0] - d.tops[d.from], Math.min(d.tops[n - 1] - d.tops[d.from], y));
    d.item.style.transform = `translateY(${dy}px)`;
    const to = Math.max(0, Math.min(n - 1, Math.round((d.tops[d.from] + dy - d.tops[0]) / d.pitch)));
    d.to = to;
    d.rows.forEach((r, j) => {
      if (j === d.from) return;
      let s = 0;
      if (d.from < to && j > d.from && j <= to) s = -d.pitch;
      else if (d.from > to && j >= to && j < d.from) s = d.pitch;
      r.style.transform = s ? `translateY(${s}px)` : '';
    });
  }

  function autoScroll() {
    if (!drag) return;
    const edge = 56;
    let v = 0;
    if (lastY < edge + 30) v = -Math.ceil((edge + 30 - lastY) / 4);
    else if (lastY > window.innerHeight - edge) v = Math.ceil((lastY - (window.innerHeight - edge)) / 4);
    if (v) { window.scrollBy(0, v); moveDrag(); }
    raf = requestAnimationFrame(autoScroll);
  }

  function endDrag() {
    track = null;
    if (!drag) return;
    cancelAnimationFrame(raf);
    const d = drag;
    drag = null;
    suppressClick = true;
    setTimeout(() => { suppressClick = false; }, 0);
    // FLIP: remember where everything is, apply the new order, then slide each row from the old spot.
    const before = new Map(d.rows.map((r) => [r, r.getBoundingClientRect().top]));
    d.rows.forEach((r) => { r.style.transition = 'none'; r.style.transform = ''; });
    d.item.classList.remove('drag');
    document.body.classList.remove('dragging');
    if (d.to !== d.from) { state.rows = moveRow(state.rows, d.from, d.to, state.chain); commit(); }
    d.rows.forEach((r) => {
      const dy = before.get(r) - r.getBoundingClientRect().top;
      if (Math.abs(dy) > 0.5) r.style.transform = `translateY(${dy}px)`;
    });
    void list.offsetHeight;
    d.rows.forEach((r) => { r.style.transition = ''; r.style.transform = ''; });
  }

  /* ---------- tooltips: long hover only ---------- */
  const tip = $('#tip');
  let tipTimer = 0, tipTarget = null, tipPinned = false; // pinned: a save result, which only a click, a key or its own timer takes down
  function showTip(t) {
    const text = t.dataset.tip;
    if (!text) return;
    tip.textContent = text;
    const r = t.getBoundingClientRect(), w = tip.offsetWidth, h = tip.offsetHeight;
    const x = Math.max(6, Math.min(window.innerWidth - w - 6, r.left + r.width / 2 - w / 2));
    let y = r.bottom + 8;
    if (y + h > window.innerHeight - 6) y = r.top - h - 8;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
    tip.classList.add('show');
  }
  function hideTip() {
    clearTimeout(tipTimer);
    tipTimer = 0;
    tipTarget = null;
    tipPinned = false;
    tip.classList.remove('show');
  }
  function armTip(t) {
    if (t === tipTarget) return;
    hideTip();
    if (!t) return;
    tipTarget = t;
    tipTimer = setTimeout(() => showTip(t), 800);
  }
  document.addEventListener('pointerover', (e) => { if (!tipPinned) armTip(e.target.closest && e.target.closest('[data-tip]')); });
  document.documentElement.addEventListener('pointerleave', hideTip);
  document.addEventListener('pointerdown', hideTip, true);
  document.addEventListener('keydown', hideTip, true);
  window.addEventListener('scroll', hideTip, true);
  document.addEventListener('focusin', (e) => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (t && e.target.matches(':focus-visible')) armTip(t);
  });
  document.addEventListener('focusout', hideTip);

  /* ---------- shared database ---------- */
  let ref = null, canSave = false, saveTimer = 0, inflight = false, retried = false, lastJson = '';
  const setWarn = (on) => { tWarn.hidden = !on; };

  function queueSave() {
    if (!canSave) return;
    if (JSON.stringify(serialize(state)) === lastJson) return;
    clearTimeout(saveTimer);
    saveTimer = setTimeout(flush, 400);
  }

  async function flush() {
    clearTimeout(saveTimer);
    saveTimer = 0;
    if (inflight || !canSave) return;
    inflight = true;
    try {
      for (;;) {
        const data = serialize(state), json = JSON.stringify(data);
        if (json === lastJson) break;
        try {
          await ref.set(data);
          lastJson = json;
          retried = false;
          setWarn(false);
        } catch (err) {
          if (err && err.code === 'unavailable' && !retried) { retried = true; await sleep(500 + Math.random() * 700); continue; }
          setWarn(true);
          break;
        }
      }
    } finally { inflight = false; }
  }

  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && saveTimer) flush(); });
  window.addEventListener('pagehide', () => { if (saveTimer) flush(); });

  /** Reload fetches the shared list again (it is only read when the page opens). A save still waiting is sent first.
   *  The icon turns once meanwhile (transform only, so it runs off the main thread); the reload waits for the turn so it is seen. */
  const SPIN = { duration: 450, easing: 'cubic-bezier(.4, 0, .2, 1)' };
  $('#reload').addEventListener('click', async () => {
    const arrow = $('#reload svg');
    if (arrow.getAnimations().length) return;
    const spun = matchMedia('(prefers-reduced-motion: reduce)').matches ? null
      : arrow.animate({ transform: ['rotate(0deg)', 'rotate(360deg)'] }, SPIN).finished;
    if (saveTimer) await flush();
    await spun;
    location.reload();
  });

  async function load() {
    let db = null;
    try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (_) { db = null; }
    if (!db) { setWarn(true); return; }
    let snap = null;
    try {
      ref = db.doc('tracker/list');
      for (let a = 0; a < 2 && !snap; a++) {
        try { snap = await ref.get(); } catch (err) { if (a === 0 && err && err.code === 'unavailable') await sleep(600); else break; }
      }
    } catch (_) { snap = null; }
    if (!snap) { setWarn(true); return; } // never write over a list that could not be read
    const remote = hydrate(snap.exists ? snap.data() : null);
    if (touched) {
      const mine = state.rows.filter((r) => !remote.rows.some((x) => x.id === r.id));
      if (!settingsTouched) { state.times = remote.times; state.chain = remote.chain; state.cols = remote.cols; }
      state.rows = remote.rows.concat(mine);
      if (state.chain) state.rows = chainOn(state.rows);
    } else {
      state.rows = remote.rows; state.times = remote.times; state.chain = remote.chain; state.cols = remote.cols;
    }
    lastJson = JSON.stringify(serialize(remote));
    canSave = true;
    render();
    queueSave();
  }

  render();
  load();
})();
</script>
